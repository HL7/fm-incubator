id: hl7.fhir.uv.fm-incubator
canonical: http://hl7.org/fhir/uv/fm-incubator/ImplementationGuide/hl7.fhir.uv.fm-incubator
name: FinancialIncubator
title: FHIR R6 Financial Incubator
description: A guide that details how to capture and exchange Financial Management (FM) data in FHIR
status: active # draft | active | retired | unknown
version: 0.1.0
fhirVersion: 6.0.0-snapshot1
copyrightYear: 2025+
releaseLabel: ci-build
license: CC0-1.0 # https://www.hl7.org/fhir/valueset-spdx-license.html
jurisdiction: http://unstats.un.org/unsd/methods/m49/m49.htm#001 "World" # https://www.hl7.org/fhir/valueset-jurisdiction.html
publisher:
  name: HL7 International / Financial Management
  url: http://www.hl7.org/Special/committees/fm
extension:
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-standards-status
    valueCode: trial-use
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-fmm
    valueInteger: 1
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-wg
    valueCode: fm

dependencies:
  hl7.fhir.r6.examples: 6.0.0-snapshot1

parameters:
  apply-publisher: true
  apply-contact: true
  globals-in-artifacts: true
  show-inherited-invariants: false
  shownav: false
  auto-oid-root: 2.16.840.1.113883.4.642.40.110
  path-pages:
    - input/pagecontent
  path-resource: 
    - input/resources/invoice
    - input/resources/enrollmentrequest
    - input/resources/enrollmentresponse
    - input/resources/insuranceplan
    - input/resources/insuranceproduct
    - input/resources/examples
  special-url-base: http://hl7.org/fhir
  additional-resource: 
    - input/resources/invoice/StructureDefinition-Invoice.xml
    - input/resources/enrollmentrequest/StructureDefinition-EnrollmentRequest.xml
    - input/resources/enrollmentresponse/StructureDefinition-EnrollmentResponse.xml
    - input/resources/insuranceplan/StructureDefinition-InsurancePlan.xml
    - input/resources/insuranceproduct/StructureDefinition-InsuranceProduct.xml

pages:
  index.md:
    title: FM Incubator
  changes.md:
    title: Change Log

resources:
  EnrollmentRequest/22345:
    name: Enrollment Request Example
    description: Enrollment request referencing a patient, insurer, provider organization, and coverage.
  EnrollmentResponse/ER2500:
    name: Enrollment Response Example
    description: Completed enrollment response confirming that a dependent was added to a policy.
  Organization/example-health-insurance:
    name: Health Insurance Company Example
    description: Fictional insurer that owns and underwrites the Sample Plan PPO product, delegating claims processing and member services to Example Benefits Administration.
  Organization/example-benefits-administrator:
    name: Benefits Administrator Example
    description: Fictional third-party administrator providing claims processing and member services for the Sample Plan PPO product on behalf of Example Health Insurance.
  InsurancePlan/example:
    name: Silver Individual Insurance Plan Example
    description: Fictional Silver individual plan linked to InsuranceProduct/example, illustrating a monthly premium, annual deductible, and in-network copayments and out-of-network coinsurance for primary and specialty care visits.
  InsuranceProduct/example:
    name: Individual Medical Insurance Product Example
    description: Fictional PPO product issued and administered by Example Health Insurance, covering primary and specialty care visits without referrals; associated premiums and cost sharing are illustrated by InsurancePlan/example.
  InsuranceProduct/example1:
    name: HL7 Staff Insurance Product Example
    description: Fictional HL7 International staff insurance product illustrating ownership, administration, contacts, and substance abuse coverage with a primary care benefit; does not represent actual HL7 insurance coverage.
  InsuranceProduct/example-onc:
    name: PPO Insurance Product Example
    description: Fictional PPO insurance product owned by Example Health Insurance and administered by Example Benefits Administration, with national coverage for diagnostic and treatment services, including primary and specialty care visits.
  InsurancePlan/example-onc:
    name: Standard Insurance Plan Example
    description: Standard insurance plan illustrating a general cost and primary and specialty care copayments and coinsurance for in-network and out-of-network care.
  InsurancePlan/example1:
    name: HL7 Staff Insurance Plan Example
    description: Fictional HL7 International staff plan illustrating a Silver plan type and a general cost of USD 2,000; does not represent an actual HL7 insurance plan.
  Invoice/example:
    name: Invoice Example
    description: Issued patient invoice identifying a cardiologist participant and cardiology department issuer, with totals of EUR 40 net and EUR 48 gross.

menu:
  Home: index.html
  Artifacts: artifacts.html
  Change Log: changes.html
